[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "monacloud"
version = "0.1.1"
description = "SDK Python zero-dependency cho MONA Cloud"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MONA Software", email = "info@themona.global" }]
dependencies = []
keywords = ["monacloud", "cloud", "vps", "database", "mona"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://monacloud.vn"
Documentation = "https://monacloud.vn/ai-agent"
Repository = "https://github.com/mona-software/monacloud-python"

[tool.setuptools.packages.find]
include = ["monacloud*"]
